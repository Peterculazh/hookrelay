name: PR description

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    # Runs the pull request's own code (npm ci, tests, build), so it gets no
    # secrets and only read access. Its result reaches `describe` as an artifact.
    verify:
        # Fork and Dependabot pull requests do not receive repository secrets.
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository
            && github.actor != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Check out pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci

            # A failing gate is a result to report, not a reason to fail the job.
            - name: Run verify gates
              env:
                  VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
              run: |
                  set +e
                  npm run verify:check > verify.txt 2>&1
                  echo "exit_code=$?" >> verify.txt
                  exit 0

            - name: Upload verify result
              uses: actions/upload-artifact@v4
              with:
                  name: verify
                  path: verify.txt

    describe:
        needs: verify
        # Still describe the PR if verify broke (for example, npm ci failed).
        if: >-
            !cancelled()
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.actor != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out pull request head
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install Claude Code
              run: npm install --global @anthropic-ai/claude-code@2.1.296

            - name: Collect pull request changes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  mkdir -p .pr-context
                  printf '%s\n' "$PR_TITLE" > .pr-context/title.txt
                  git log --oneline "$BASE_SHA..$HEAD_SHA" > .pr-context/log.txt
                  git diff --stat "$BASE_SHA...$HEAD_SHA" > .pr-context/stat.txt
                  git diff "$BASE_SHA...$HEAD_SHA" > .pr-context/diff.patch

            # Missing artifact means verify did not run; the prompt reports that.
            - name: Add verify result
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: verify
                  path: .pr-context

            # The diff is untrusted input, so this step gets read-only tools,
            # ignores the repository's Claude settings and has no GitHub token.
            - name: Write description
              env:
                  OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  if [ -n "$OAUTH_TOKEN" ]; then
                    export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
                  elif [ -n "$API_KEY" ]; then
                    export ANTHROPIC_API_KEY="$API_KEY"
                  else
                    echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY repository secret."
                    exit 1
                  fi
                  set +e
                  claude --print --restricted --strict-mcp-config --disable-slash-commands \
                    --tools "Read,Grep,Glob" --allowedTools "Read,Grep,Glob" \
                    --model claude-sonnet-5-5 --max-turns 30 --output-format json \
                    < .github/pr-description-prompt.md > .pr-context/claude.json
                  code=$?
                  set -e

                  # Only a successful, non-empty result may reach the PR body.
                  out=.pr-context/claude.json
                  fail() { echo "::error::$1"; exit 1; }
                  [ "$code" -eq 0 ] || fail "claude exited with code $code"
                  jq -e . "$out" > /dev/null 2>&1 || fail "claude output is not valid JSON"
                  subtype=$(jq -r '.subtype' "$out")
                  [ "$subtype" = "success" ] || fail "subtype is '$subtype', expected 'success'"
                  is_error=$(jq -r '.is_error' "$out")
                  [ "$is_error" = "false" ] || fail "is_error is '$is_error', expected 'false'"
                  jq -e '.result | type == "string" and test("[^[:space:]]")' "$out" > /dev/null \
                    || fail "result is empty or missing"
                  jq -r '.result' "$out" > .pr-context/summary.md

            - name: Update pull request description
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: node .github/scripts/update-pr-description.mjs
