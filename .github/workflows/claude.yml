name: Claude
on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
jobs:
    claude:
        if: contains(github.event.comment.body, '@claude')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - run: npm ci
            - uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  claude_args: '--max-turns 30 --model claude-sonnet-5-5 --allowedTools "Skill(verify),Bash(npm run verify:check*),Bash(git diff *),Bash(git status *),Bash(npm test*),Bash(npm run lint*),Bash(npm run typecheck*)"'
