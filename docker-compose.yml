x-application-image: &application-image
  image: hookrelay:local
  build:
    context: .
  init: true

x-database-environment: &database-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_USER: ${DB_USER:-dbuser}
  DB_PASSWORD: ${DB_PASSWORD:-dbpassword}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-db}
  DB_SSL: "${DB_SSL:-false}"
  DB_POOL_MAX: "${DB_POOL_MAX:-10}"
  DB_IDLE_TIMEOUT: "${DB_IDLE_TIMEOUT:-10000}"
  DB_CONNECTION_TIMEOUT: "${DB_CONNECTION_TIMEOUT:-5000}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dbuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbpassword}
      POSTGRES_DB: ${DB_NAME:-db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    <<: *application-image
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  test-receiver:
    <<: *application-image
    command: ["node", "dist/apps/test-receiver/main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TEST_RECEIVER_PORT: "3001"
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  hookrelay:
    <<: *application-image
    command: ["node", "dist/apps/hookrelay/main.js"]
    restart: unless-stopped
    environment:
      <<: *database-environment
      PORT: "3000"
      WEBHOOK_TARGET_URL: http://test-receiver:3001/webhooks
    expose:
      - "9464"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *application-image
    command: ["node", "dist/apps/worker/main.js"]
    restart: unless-stopped
    environment:
      <<: *database-environment
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
    expose:
      - "9465"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Keep one relay instance until multi-relay coordination is deliberately tested.
  relay:
    <<: *application-image
    command: ["node", "dist/apps/relay/main.js"]
    restart: unless-stopped
    environment:
      <<: *database-environment
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
    expose:
      - "9466"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-hookrelay-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-18082}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
