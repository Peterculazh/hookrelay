global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
  - job_name: hookrelay-api
    dns_sd_configs:
      - names: ['hookrelay-api-metrics.hookrelay.svc.cluster.local']
        type: A
        port: 9464
        refresh_interval: 15s
  - job_name: hookrelay-worker
    dns_sd_configs:
      - names: ['hookrelay-worker-metrics.hookrelay.svc.cluster.local']
        type: A
        port: 9465
        refresh_interval: 15s
  - job_name: hookrelay-relay
    dns_sd_configs:
      - names: ['hookrelay-relay-metrics.hookrelay.svc.cluster.local']
        type: A
        port: 9466
        refresh_interval: 15s
