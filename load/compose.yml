x-app: &app
  image: hookrelay:load
  build:
    context: ..
  init: true
  stop_grace_period: 30s
  cpus: 1
  mem_limit: 512m

x-db: &db
  NODE_ENV: production
  LOG_LEVEL: '${BENCH_LOG_LEVEL:-warn}'
  DB_USER: loadtest
  DB_PASSWORD: loadtest
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: loadtest
  DB_SSL: 'false'
  DB_POOL_MAX: '10'

services:
  postgres:
    image: postgres:17-alpine
    cpus: 2
    mem_limit: 512m
    environment:
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
      POSTGRES_DB: loadtest
    ports: ['127.0.0.1::5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loadtest -d loadtest']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    cpus: 1
    mem_limit: 256m
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    command: ['npm', 'run', 'db:migrate']
    environment: *db
    depends_on:
      postgres: { condition: service_healthy }
  hookrelay:
    <<: *app
    command: ['node', 'dist/apps/hookrelay/main.js']
    environment:
      <<: *db
      PORT: '3000'
      WEBHOOK_TARGET_URL: http://receiver-proxy:3002/webhooks
    ports: ['127.0.0.1::3000', '127.0.0.1::9464']
    depends_on:
      migrate: { condition: service_completed_successfully }
  relay:
    <<: *app
    command: ['node', 'dist/apps/relay/main.js']
    environment:
      <<: *db
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      RELAY_BATCH_SIZE: '${BENCH_RELAY_BATCH_SIZE:-100}'
      RELAY_PUBLISH_INTERVAL_SECONDS: '${BENCH_RELAY_INTERVAL_SECONDS:-10}'
    ports: ['127.0.0.1::9466']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    <<: *app
    command: ['node', 'dist/apps/worker/main.js']
    environment:
      <<: *db
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      WORKER_CONCURRENCY: '${BENCH_CONCURRENCY:-1}'
    ports: ['127.0.0.1::9465']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  test-receiver:
    <<: *app
    command: ['node', 'dist/apps/test-receiver/main.js']
    environment:
      <<: *db
      TEST_RECEIVER_PORT: '3001'
    depends_on:
      migrate: { condition: service_completed_successfully }
  receiver-proxy:
    image: hookrelay:load
    init: true
    cpus: 1
    mem_limit: 256m
    command: ['node', '/bench/receiver-proxy.mjs']
    volumes: ['./receiver-proxy.mjs:/bench/receiver-proxy.mjs:ro']
    depends_on: [test-receiver]
volumes:
  postgres_data:
  redis_data:
